[package]
name = "gum-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Gum's API server: one-time stablecoin deposit addresses, settled by gum-indexer + gum-engine."

[lib]
name = "gum_server"
path = "src/lib.rs"

[[bin]]
name = "gum-server"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[dependencies]
alloy-primitives = { version = "1", features = ["serde", "std", "rlp"] }
alloy-sol-types = "1"
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
figment = { version = "0.10", features = ["toml", "env"] }
governor = "0.10"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = "9"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
moka = { version = "0.12", features = ["sync"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "derive", "uuid", "chrono", "json"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["load-shed", "limit", "util"] }
tower-http = { version = "0.7", features = ["trace", "limit", "request-id", "timeout", "catch-panic", "cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
wiremock = "0.6"
