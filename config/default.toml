# gum-server base configuration.
#
# Secrets and endpoint URLs come from the environment as GUM_<SECTION>__<KEY>, e.g.
#   GUM_SERVER__PUBLIC_BASE_URL, GUM_PRIVY__APP_ID, GUM_PRIVY__VERIFICATION_KEY,
#   GUM_PAYMENTS__FACTORY_ADDRESS, GUM_PAYMENTS__RECOVERY_ADDRESS,
#   GUM_INDEXER__BASE_URL, GUM_INDEXER__WEBHOOK_SECRET,
#   GUM_ENGINE__BASE_URL, GUM_ENGINE__WEBHOOK_SECRET.
# DATABASE_URL and PORT are read as-is (Railway provides both).

[server]
bind = "::"
port = 8080
# Base URL gum-indexer and gum-engine use to call back to this service:
# {callback_base_url}/v1/webhooks/{indexer,engine}. All three services share one Railway project, so
# this is the private-network address (http://gum-server.railway.internal:8080), never the public
# api.gum.money domain. Public traffic (apps) only ever reaches /v1/deposit and friends.
callback_base_url = ""
request_timeout_ms = 10000
max_body_bytes = 65536
# Requests in flight before the server sheds load with 503.
max_in_flight = 4096
shutdown_grace_secs = 25
# Browser origins allowed to call the API, e.g. ["https://app.gum.money"]. Empty = no CORS headers.
#   GUM_SERVER__CORS_ORIGINS='["https://app.gum.money"]'
cors_origins = []

[database]
# Bursts need headroom: up to 16 engine + 8 indexer webhooks at once, 8 outbox workers, the
# reconciler, and API traffic. Each of those holds one connection at a time.
max_connections = 32
min_connections = 2
acquire_timeout_ms = 3000
auto_migrate = true
# No database wait is unbounded (see src/db.rs). A statement waiting on a row lock gives up after
# lock_timeout_ms, any statement after statement_timeout_ms, and a transaction left open is ended
# after idle_in_transaction_timeout_ms. Callers retry (outbox) or answer 503 (requests).
statement_timeout_ms = 30000
lock_timeout_ms = 5000
idle_in_transaction_timeout_ms = 60000

[privy]
app_id = ""
# PEM-encoded verification key from the Privy dashboard. "\n" escapes are accepted.
verification_key = ""
clock_skew_secs = 30

[api_keys]
# Keys are cached in memory after a successful lookup. A rotated key is refused on
# this instance immediately and on other instances within this TTL.
cache_ttl_secs = 30
# Per-key token bucket.
rate_limit_per_second = 50
rate_limit_burst = 100

[payments]
# PaymentFactory address, identical on every supported chain (see gum-contracts Bootstrap.s.sol).
factory_address = ""
# Our privileged recovery address, passed as `recovery` to every payment.
recovery_address = ""
min_expiry_lead_secs = 300
max_expiry_secs = 2592000

[indexer]
base_url = ""
# gum-indexer's GUM_WEBHOOK__SECRET; used to verify inbound signatures.
webhook_secret = ""
timeout_ms = 5000

[engine]
base_url = ""
# gum-engine's webhook.signing_secret; used to verify inbound signatures.
webhook_secret = ""
timeout_ms = 5000

[webhooks]
# How old an inbound X-Gum-Signature timestamp may be.
inbound_tolerance_secs = 300
# Production: app webhooks must be public https URLs.
allow_insecure_targets = false
connect_timeout_ms = 3000
request_timeout_ms = 10000
retry_base_ms = 1000
retry_cap_ms = 3600000
max_age_secs = 86400

[outbox]
workers = 8
poll_interval_ms = 500
batch_size = 32
lock_ttl_secs = 60
# A job still running after this is abandoned and retried, so one stuck job cannot hold up the
# outbox (e.g. a query on a connection that died without closing). Must be below lock_ttl_secs.
job_timeout_ms = 30000
# Jobs towards gum-indexer / gum-engine are on the settlement's critical path: short backoff cap,
# retried until the deposit is terminal. App webhooks use [webhooks] retry_cap_ms / max_age_secs.
upstream_retry_cap_ms = 30000

[reconciler]
interval_secs = 60
# A deposit still in `paid` this long after its settlement was submitted is polled from the
# engine. Settlement takes seconds on every supported chain, so a minute means a webhook was lost.
# Measured from the submission, so late webhooks for the job do not push the poll back.
paid_stale_secs = 60
# ...and polled again at most this often (also the quiet period after any webhook for it).
paid_repoll_secs = 30
# An open deposit (pending / partial_paid) that has not changed for this long is checked against
# the indexer's watch, in case a payment.* / threshold.reached delivery was lost.
open_stale_secs = 900
idempotency_ttl_secs = 86400

[admin]
# Bearer token for /v1/admin routes. Empty disables them.
token = ""

# ---------------------------------------------------------------------------------------------
# Chains and tokens. Must mirror gum-indexer's registry; adding one is a config-only change.
# `address` is the ERC-20 the payment's settlement call targets and the indexer's watches use;
# amounts are always in its `decimals`.
#
# `enabled` (default true) offers the chain for new deposits. Add a chain with `enabled = false`,
# deploy, and set GUM_CHAINS__<NAME>__ENABLED=true only once all three hold:
#   1. the PaymentFactory generation is deployed on it (eth_getCode at payments.factory_address),
#   2. gum-indexer has the chain enabled (`chain ready` in its logs),
#   3. gum-engine has the chain running (`chain.started` in its logs).
# Enabled too early, deposits get addresses that nothing watches or settles. The variable is also a
# boot error ("missing field chain_id") on code that does not have the chain's table yet.
# ---------------------------------------------------------------------------------------------

[chains.monad]
chain_id = 143

[[chains.monad.tokens]]
symbol = "USDC"
address = "0x754704Bc059F8C67012fEd69BC8A327a5aafb603"
decimals = 6

[[chains.monad.tokens]]
symbol = "USDT"
address = "0xe7cd86e13AC4309349F30B3435a9d337750fC82D"
decimals = 6

[[chains.monad.tokens]]
symbol = "AUSD"
address = "0x00000000eFE302BEAA2b3e6e1b18d08D69a9012a"
decimals = 6

[chains.arbitrum]
chain_id = 42161

[[chains.arbitrum.tokens]]
symbol = "USDC"
address = "0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
decimals = 6

[[chains.arbitrum.tokens]]
symbol = "USDT"
address = "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9"
decimals = 6

[chains.base]
chain_id = 8453

[[chains.base.tokens]]
symbol = "USDC"
address = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
decimals = 6

# Arc (Circle's L1, launched 2026-09-16): USDC is the gas token. One balance, two interfaces:
# native USDC (18 decimals, msg.value) and the ERC-20 at 0x3600…0000 (6 decimals). A payer may send
# either way. gum-indexer counts both through Arc's EIP-7708 system emitter and reports 6-decimal
# amounts against this ERC-20, and the Payment settles through it, so here Arc USDC is an ordinary
# 6-decimal token. Native dust below 0.000001 USDC is not counted and stays at the payment address.
[chains.arc]
chain_id = 5042
enabled = false

[[chains.arc.tokens]]
symbol = "USDC"
address = "0x3600000000000000000000000000000000000000"
decimals = 6
