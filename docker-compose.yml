# Local Postgres for development and tests.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gum
      POSTGRES_PASSWORD: gum
      POSTGRES_DB: gum_server
    ports:
      - "54340:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gum"]
      interval: 2s
      timeout: 3s
      retries: 30
